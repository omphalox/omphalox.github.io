<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>TexLock</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="cipher-card">
            <h1>TexLock</h1>
            <div class="footer-note"> ⚡ Send & Receive private messages with AES-256-GCM | secure & authenticated encryption 🔐 </div>
            <hr>

            <!-- Input textbox (plaintext / ciphertext) -->
            <div class="field-group">
                <label>📄 INPUT / CIPHER TEXT</label>
                <textarea id="inputText" class="text-input" rows="2" placeholder="Type text to encrypt or paste encrypted string to decrypt..."></textarea>
            </div>

            <!-- Passphrase field -->
            <div class="field-group">
                <label>🗝️ PASSPHRASE (AES-256)</label>
                <input type="password" id="passphrase" class="pass-input" placeholder="Your secret passphrase" autocomplete="off">
            </div>

            <!-- Action buttons row: Encrypt / Decrypt / Copy / Clear -->
            <div class="button-row">
                <button id="encryptBtn" class="btn btn-primary">🔒 Encrypt</button>
                <button id="decryptBtn" class="btn btn-secondary">🔓 Decrypt</button>
                <button id="copyBtn" class="btn btn-outline">📋 Copy</button>
                <button id="clearBtn" class="btn btn-clear">🗑️ Clear fields</button>
            </div>

            <!-- Output textbox -->
            <div class="output-area">
                <label>📎 OUTPUT</label>
                <textarea id="outputText" class="output-box" rows="3" readonly placeholder="Result will appear here..."></textarea>
            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
